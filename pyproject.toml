[project]
name = "event-pipeline-recovery"
version = "0.1.0"
description = "Event-driven AWS data pipeline with dead-letter replay, idempotent reruns, late-data handling, and a data-quality gate."
requires-python = ">=3.12"
dependencies = ["boto3>=1.34", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[s3,sqs]>=5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
